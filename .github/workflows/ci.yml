name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run the test suite
        working-directory: backend
        run: python -m pytest -q

      - name: Plan a 20 second film from a short prompt (no API calls)
        run: |
          python scripts/smoke_run.py --seconds 20 --dry-run --live \
            --prompt "A red fox trots through a snowy pine forest at dusk, stops, and looks straight at the camera"

      - name: End-to-end film at 20 seconds (mock provider, real FFmpeg)
        env:
          OMNIREEL_DATA_DIR: ${{ runner.temp }}/omnireel-smoke
        run: |
          python scripts/smoke_run.py --seconds 20 --expect 20

      - name: Contact sheet from the film
        env:
          OMNIREEL_DATA_DIR: ${{ runner.temp }}/omnireel-smoke
        run: |
          FILM=$(ls "$OMNIREEL_DATA_DIR"/outputs/*.mp4 | head -n 1)
          echo "film: $FILM"
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 "$FILM"
          ffmpeg -y -hide_banner -loglevel error -i "$FILM" \
            -vf "fps=1/2,scale=320:-1,tile=5x2:padding=4:margin=0:color=black" \
            -frames:v 1 "$OMNIREEL_DATA_DIR/contact-sheet.png"
          ls -l "$OMNIREEL_DATA_DIR/contact-sheet.png"

      - name: Upload the mock film (a pipeline test, NOT AI footage)
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-test-mock-20s-not-ai-footage
          path: |
            ${{ runner.temp }}/omnireel-smoke/outputs/*.mp4
            ${{ runner.temp }}/omnireel-smoke/contact-sheet.png
            ${{ runner.temp }}/omnireel-smoke/clips/**/*.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Verify the app imports and boots its schema
        working-directory: backend
        env:
          OMNIREEL_DATA_DIR: ${{ runner.temp }}/omnireel-ci
          OMNIREEL_ENABLE_MOCK: "1"
        run: |
          python - <<'PY'
          from omnireel.api import create_app
          from omnireel.config import Settings

          settings = Settings.from_env()
          settings.ensure_dirs()
          app = create_app(settings)
          from fastapi.testclient import TestClient
          client = TestClient(app)
          health = client.get("/api/health").json()
          assert health["status"] == "ok", health
          config = client.get("/api/config").json()
          assert config["durations_ladder"], config
          print("boot ok:", health["version"], config["durations_ladder"])
          PY

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Confirm the build produced an entry point
        run: test -f frontend/dist/index.html
