name: Live 20 second film

# Makes a REAL film from your prompt, with real AI generation, from the GitHub
# web UI - no terminal, no local install. Requires one provider secret:
#
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   BIGMODEL_API_KEY   (free: CogVideoX-Flash is priced 免费)
#   AGNES_API_KEY      or MODELSCOPE_API_TOKEN also work
#
# A 20-second film over these models is two API calls, which is why this
# workflow defaults to 20 rather than 120.

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "What to film (one or two visual beats work best at 20 s)"
        required: true
        default: "A red fox trots through a snowy pine forest at dusk, stops, and looks straight at the camera"
      seconds:
        description: "Film length in seconds (20 = two calls; 120 = 10-24 calls)"
        required: true
        default: "20"
      style:
        description: "cinematic, documentary, anime, nature, noir, scifi, product, explainer"
        required: true
        default: "nature"
  # Committing requests/film.txt starts a run too, so a film can be asked for
  # without the Actions UI: line 1 is the prompt, line 2 the seconds, line 3 the
  # style. Editing that file and committing it is the whole trigger.
  push:
    paths:
      - "requests/film.txt"

permissions:
  contents: read

concurrency:
  group: live-film
  # A new request supersedes one that is stuck, instead of queueing behind it.
  cancel-in-progress: true

jobs:
  film:
    name: Generate a real film
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Resolve the film request
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PROMPT: ${{ inputs.prompt }}
          DISPATCH_SECONDS: ${{ inputs.seconds }}
          DISPATCH_STYLE: ${{ inputs.style }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "Reading requests/film.txt (line 1 prompt, 2 seconds, 3 style)"
            PROMPT=$(sed -n '1p' requests/film.txt)
            SECONDS_TARGET=$(sed -n '2p' requests/film.txt)
            FILM_STYLE=$(sed -n '3p' requests/film.txt)
          else
            PROMPT="$DISPATCH_PROMPT"
            SECONDS_TARGET="$DISPATCH_SECONDS"
            FILM_STYLE="$DISPATCH_STYLE"
          fi
          echo "prompt:  $PROMPT"
          echo "seconds: $SECONDS_TARGET"
          echo "style:   $FILM_STYLE"
          {
            echo "PROMPT<<PROMPT_EOF"
            echo "$PROMPT"
            echo "PROMPT_EOF"
            echo "SECONDS_TARGET=$SECONDS_TARGET"
            echo "FILM_STYLE=$FILM_STYLE"
          } >> "$GITHUB_ENV"

      # Inputs reach the shell through the environment, never through inline
      # interpolation, so a prompt containing quotes or $() cannot break or
      # inject into the command line.
      - name: Check for a provider key
        id: key
        env:
          BIGMODEL_API_KEY: ${{ secrets.BIGMODEL_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: |
          echo "Repository secrets this workflow reads. Values are never printed;"
          echo "the length is shown so a truncated paste is visible."
          for name in BIGMODEL_API_KEY ZHIPU_API_KEY AGNES_API_KEY MODELSCOPE_API_TOKEN POLLINATIONS_API_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "  $name: set (${#value} characters)"
            else
              echo "  $name: not set"
            fi
          done
          if [ -z "$BIGMODEL_API_KEY$ZHIPU_API_KEY$AGNES_API_KEY$MODELSCOPE_API_TOKEN$POLLINATIONS_API_KEY" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: No key configured
        if: steps.key.outputs.found != 'true'
        run: |
          echo "::error::None of the secrets above are set, so no film can be generated."
          echo "Add one secret, then run this workflow again:"
          echo "  Settings -> Secrets and variables -> Actions -> New repository secret"
          echo "  Name:  BIGMODEL_API_KEY"
          echo "  Value: the key from bigmodel.cn (free - CogVideoX-Flash is priced 免费)"
          echo "A key stored in a local .env on your own machine cannot reach this workflow."
          exit 1

      - name: Plan the film first (no API calls)
        if: steps.key.outputs.found == 'true'
        env:
          # The key is needed here too: the planner only counts providers that
          # are configured, so without it the printed plan is the one you would
          # get with every model available, not the one about to run.
          BIGMODEL_API_KEY: ${{ secrets.BIGMODEL_API_KEY || secrets.ZHIPU_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: |
          python scripts/smoke_run.py --seconds "$SECONDS_TARGET" --dry-run --live \
            --style "$FILM_STYLE" --prompt "$PROMPT"

      - name: Probe the provider (one real call)
        id: probe
        if: steps.key.outputs.found == 'true'
        env:
          BIGMODEL_API_KEY: ${{ secrets.BIGMODEL_API_KEY || secrets.ZHIPU_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: |
          python scripts/smoke_run.py --probe --live

      - name: Generate the film
        if: steps.probe.outcome == 'success'
        env:
          OMNIREEL_DATA_DIR: ${{ runner.temp }}/omnireel-live
          BIGMODEL_API_KEY: ${{ secrets.BIGMODEL_API_KEY || secrets.ZHIPU_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: |
          python scripts/smoke_run.py --seconds "$SECONDS_TARGET" --live \
            --style "$FILM_STYLE" --prompt "$PROMPT"

      - name: Contact sheet
        if: steps.probe.outcome == 'success'
        env:
          OMNIREEL_DATA_DIR: ${{ runner.temp }}/omnireel-live
        run: |
          FILM=$(ls "$OMNIREEL_DATA_DIR"/outputs/*.mp4 | head -n 1)
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 "$FILM"
          ffmpeg -y -hide_banner -loglevel error -i "$FILM" \
            -vf "fps=1/2,scale=320:-1,tile=5x2:padding=4:margin=0:color=black" \
            -frames:v 1 "$OMNIREEL_DATA_DIR/contact-sheet.png"

      - name: Upload the REAL film
        if: steps.probe.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: REAL-AI-film
          path: |
            ${{ runner.temp }}/omnireel-live/outputs/*.mp4
            ${{ runner.temp }}/omnireel-live/contact-sheet.png
            ${{ runner.temp }}/omnireel-live/clips/**/*.mp4
          if-no-files-found: error
          retention-days: 30
