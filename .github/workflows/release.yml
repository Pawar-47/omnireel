name: Release

# Publishing is deliberate: push a version tag and GitHub builds the release.
#   git tag -a v1.0.0 -m "OmniReel 1.0.0" && git push origin v1.0.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: OmniReel ${{ github.ref_name }}
          body: |
            Multi-provider AI video studio.

            See [CHANGELOG.md](CHANGELOG.md) for what changed and
            [INSTALLATION.md](INSTALLATION.md) for setup on Linux Mint.

            Status at this version: the backend test suite and frontend build
            pass on GitHub Actions. Only the Agnes provider has been verified
            against live vendor documentation; confirm the other adapters
            against your own accounts before enabling them.
